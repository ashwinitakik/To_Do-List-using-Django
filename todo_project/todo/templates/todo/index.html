<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2 class="text-center">My To-Do List</h2>

<div class="card p-4 mb-4">
    <input type="text" id="title" class="form-control mb-2" placeholder="Enter Title">
    <textarea id="description" class="form-control mb-2" placeholder="Enter Description"></textarea>
    <button onclick="addTask()" class="btn btn-primary">Add Task</button>
</div>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Completed</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="taskList"></tbody>
</table>

<script>

const apiURL = "http://127.0.0.1:8000/api/tasks/";

function fetchTasks() {
    fetch(apiURL)
    .then(response => response.json())
    .then(data => {
        let rows = "";
        data.forEach(task => {
            rows += `
                <tr>
                    <td>${task.title}</td>
                    <td>${task.description}</td>
                    <td>${task.completed}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById("taskList").innerHTML = rows;
    });
}

function addTask() {
    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;

    fetch(apiURL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            description: description,
            completed: false
        })
    })
    .then(response => response.json())
    .then(() => {
        fetchTasks();
    });
}

function deleteTask(id) {
    fetch(apiURL + id + "/", {
        method: "DELETE"
    })
    .then(() => {
        fetchTasks();
    });
}

fetchTasks();

</script>

</body>
</html>
